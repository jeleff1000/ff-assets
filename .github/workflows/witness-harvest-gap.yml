name: witness-harvest-gap

# STAGE 3: harvest ONLY what we do not already hold.
#
# Every family below was proven by a pilot before landing here, and the page counts are
# gaps measured against harvest/HOLDINGS.json -- not whole datasets. Re-fetching held
# pages spends the politeness budget at small independent archives for nothing.
#
# WHY THIS EXISTS: the statscrew roster capture reported coverage_complete: true while
# holding 1,085 of 2,416 team-seasons (45%). "Complete" meant every SHARD reported, not
# every work item captured. This workflow harvests against the SEED INVENTORY as the
# denominator, so a gap is visible as a gap.
#
# CONCURRENCY: bounded PER HOST, not per matrix. The first run of this workflow set
# max-parallel 15 while every one of its 15 jobs targeted statscrew.com, so the intended
# "spread across hosts" was 15 concurrent streams at one small independent archive. The
# site refused robots.txt to one runner, and that shard recorded 477 robots-denied URLs
# in 0.65s and reported green -- 178 team-seasons of its partition are still uncaptured.
#
# Per-host request rate is (concurrent jobs at that host) / delay_seconds. With
# statscrew at 1.0s, max-parallel 5 is 5 req/s; 15 was 15 req/s sustained for an hour.
# The gain does not justify it: StatsCrew is a candidate-independent root and the only
# pre-1994 tackle source we have found, so being blocked costs the whole capture.
# If this matrix ever spans several hosts again, raise the cap alongside that spread --
# never on its own.

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Page cap per shard
        default: "4000"
      only_source:
        description: Limit to one source (blank = all)
        default: ""
      only_dataset:
        description: Limit to one dataset (blank = all)
        default: ""

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # 5 concurrent jobs at statscrew.com == 5 req/s at delay_seconds 1.0. See the
      # per-host note above before raising this.
      max-parallel: 5
      matrix:
        target:
          # statscrew -- 5 shards: the roster GAP plus two pilot-proven stat families
          - {source: statscrew, dataset: team_season_roster, shards: 5}
          - {source: statscrew, dataset: team_season_stats, shards: 5}
          - {source: statscrew, dataset: team_season_results, shards: 5}
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --requirement requirements-harvest.txt
      - run: python -m pytest tests -q
      - name: Skip sources not selected
        id: gate
        run: |
          want="${{ github.event.inputs.only_source }}"
          want_dataset="${{ github.event.inputs.only_dataset }}"
          run=true
          if [ -n "$want" ] && [ "$want" != "${{ matrix.target.source }}" ]; then run=false; fi
          if [ -n "$want_dataset" ] && [ "$want_dataset" != "${{ matrix.target.dataset }}" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Census the gap (seed inventory minus holdings)
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m harvest.census
          --source "${{ matrix.target.source }}"
          --dataset "${{ matrix.target.dataset }}"
          --max-pages "${{ github.event.inputs.max_pages || '4000' }}"
          --shard "${{ matrix.shard }}"
          --num-shards "${{ matrix.target.shards }}"
          --out "out/census-${{ matrix.target.dataset }}-${{ matrix.shard }}"
          --run-id "${{ github.run_id }}"
      - name: Harvest the gap
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m harvest.runner
          --source "${{ matrix.target.source }}"
          --dataset "${{ matrix.target.dataset }}"
          --work-items "out/census-${{ matrix.target.dataset }}-${{ matrix.shard }}/WORK_ITEMS.jsonl"
          --shard "${{ matrix.shard }}"
          --num-shards "${{ matrix.target.shards }}"
          --work-items-prepartitioned
          --run-id "${{ github.run_id }}"
          --out "out/harvest-${{ matrix.target.dataset }}-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: witness-gap-${{ matrix.target.source }}-${{ matrix.target.dataset }}-${{ matrix.shard }}
          path: out/harvest-${{ matrix.target.dataset }}-${{ matrix.shard }}
          retention-days: 14
