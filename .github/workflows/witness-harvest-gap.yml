name: witness-harvest-gap

# STAGE 3: harvest ONLY what we do not already hold.
#
# Every family below was proven by a pilot before landing here, and the page counts are
# gaps measured against harvest/HOLDINGS.json -- not whole datasets. Re-fetching held
# pages spends the politeness budget at small independent archives for nothing.
#
# WHY THIS EXISTS: the statscrew roster capture reported coverage_complete: true while
# holding 1,085 of 2,416 team-seasons (45%). "Complete" meant every SHARD reported, not
# every work item captured. This workflow harvests against the SEED INVENTORY as the
# denominator, so a gap is visible as a gap.
#
# CONCURRENCY: bounded PER HOST, not per matrix. The first run of this workflow set
# max-parallel 15 while every one of its 15 jobs targeted statscrew.com, so the intended
# "spread across hosts" was 15 concurrent streams at one small independent archive. The
# site refused robots.txt to one runner, and that shard recorded 477 robots-denied URLs
# in 0.65s and reported green -- 178 team-seasons of its partition are still uncaptured.
#
# Per-host request rate is (concurrent jobs at that host) / delay_seconds. With
# statscrew at 1.0s, max-parallel 5 is 5 req/s; 15 was 15 req/s sustained for an hour.
# The gain does not justify it: StatsCrew is a candidate-independent root and the only
# pre-1994 tackle source we have found, so being blocked costs the whole capture.
# If this matrix ever spans several hosts again, raise the cap alongside that spread --
# never on its own.

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Page cap per shard
        default: "4000"
      only_source:
        description: Limit to one source (blank = all)
        default: ""
      only_dataset:
        description: Limit to one dataset (blank = all)
        default: ""
      only_shard:
        description: Limit to one shard (blank = all) -- retry a blocked shard without
          re-crawling the ones that succeeded
        default: ""
      shards:
        description: Partition count (blank = catalog default). Smaller slices shrink the
          blast radius of a wedged shard; this does NOT raise the per-host request rate,
          which max-parallel sets independently.
        default: ""
      budget_minutes:
        description: Wall-clock budget per shard. A wedged shard FAILS at this point
          instead of burning the 350-minute job timeout and being cancelled.
        default: "90"

jobs:
  # WHICH JOBS EXIST is decided here, before any of them are created. Filtering INSIDE
  # the jobs also worked -- a shard-1 retry made zero requests anywhere else -- but
  # GitHub still created all fifteen, and each checked out, pip-installed and ran pytest
  # before finding it had nothing to do. Retrying one shard spun up fourteen runners to
  # do nothing, which in the run list is indistinguishable from re-running everything.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      max_parallel: ${{ steps.build.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --requirement requirements-harvest.txt
      - run: python -m pytest tests -q
      - name: Plan the matrix
        id: build
        run: >-
          python -m harvest.plan_matrix
          --only-source "${{ github.event.inputs.only_source }}"
          --only-dataset "${{ github.event.inputs.only_dataset }}"
          --only-shard "${{ github.event.inputs.only_shard }}"
          --shards "${{ github.event.inputs.shards }}"

  harvest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # DERIVED from the planned jobs and the catalog delay, not asserted independently
      # of them: N concurrent jobs at one host send N/delay_seconds requests per second.
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --requirement requirements-harvest.txt
      - name: Census the gap (seed inventory minus holdings)
        run: >-
          python -m harvest.census
          --source "${{ matrix.source }}"
          --dataset "${{ matrix.dataset }}"
          --max-pages "${{ github.event.inputs.max_pages || '4000' }}"
          --shard "${{ matrix.shard }}"
          --num-shards "${{ matrix.shards }}"
          --out "out/census-${{ matrix.dataset }}-${{ matrix.shard }}"
          --budget-minutes "${{ github.event.inputs.budget_minutes || '90' }}"
          --run-id "${{ github.run_id }}"
      - name: Harvest the gap
        run: >-
          python -m harvest.runner
          --source "${{ matrix.source }}"
          --dataset "${{ matrix.dataset }}"
          --work-items "out/census-${{ matrix.dataset }}-${{ matrix.shard }}/WORK_ITEMS.jsonl"
          --shard "${{ matrix.shard }}"
          --num-shards "${{ matrix.shards }}"
          --work-items-prepartitioned
          --budget-minutes "${{ github.event.inputs.budget_minutes || '90' }}"
          --run-id "${{ github.run_id }}"
          --out "out/harvest-${{ matrix.dataset }}-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        with:
          name: witness-gap-${{ matrix.source }}-${{ matrix.dataset }}-${{ matrix.shard }}
          path: out/harvest-${{ matrix.dataset }}-${{ matrix.shard }}
          retention-days: 14
